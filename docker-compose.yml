x-app-build: &app-build
  context: .
  dockerfile: docker/app/Dockerfile

x-app-environment: &app-environment
  APP_NAME: MatchIQ
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: http://localhost:${APP_PORT:-8000}
  APP_KEY: ${APP_KEY:-}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${POSTGRES_DB:-matchiq}
  DB_USERNAME: ${POSTGRES_USER:-matchiq}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-matchiq}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-matchiq}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-matchiq}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  # Browser-facing Vite URL (host port). Container still listens on 5173.
  VITE_DEV_SERVER_URL: http://localhost:${VITE_HOST_PORT:-5173}

services:
  app:
    image: matchiq-app
    build: *app-build
    working_dir: /var/www/html
    volumes:
      - ./web:/var/www/html
    ports:
      - "${APP_PORT:-8000}:8000"
    environment: *app-environment
    # healthy = vendor установлен, миграции применены, сервер отвечает: от этого зависят воркеры ingest.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - matchiq

  # Воркер результатов ingest: ingest.results -> PostgreSQL. Перезапускается сам; --max-time обновляет процесс раз в час.
  ingest-consume:
    image: matchiq-app
    build: *app-build
    working_dir: /var/www/html
    volumes:
      - ./web:/var/www/html
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"
    command: ["php", "artisan", "ingest:consume", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - matchiq

  # Планировщик Laravel: плановые ingest-прогоны (config/ingest.php) и ingest:reap-stuck.
  scheduler:
    image: matchiq-app
    build: *app-build
    working_dir: /var/www/html
    volumes:
      - ./web:/var/www/html
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "0"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - matchiq

  vite:
    image: node:22-bookworm
    working_dir: /var/www/html
    volumes:
      - ./web:/var/www/html
    ports:
      - "${VITE_HOST_PORT:-5173}:5173"
    environment:
      VITE_HOST: "0.0.0.0"
      # Used by vite.config.js HMR clientPort when host≠container port
      VITE_HOST_PORT: ${VITE_HOST_PORT:-5173}
    # Drop stale optimize cache so interrupted re-optimize cannot skip .vue transforms.
    command: sh -c "npm install && rm -rf node_modules/.vite && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - matchiq

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matchiq}
      POSTGRES_USER: ${POSTGRES_USER:-matchiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchiq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matchiq} -d ${POSTGRES_DB:-matchiq}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - matchiq

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6389}:6379"
    volumes:
      - redis_data:/data
    networks:
      - matchiq

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: matchiq-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-matchiq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-matchiq}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - matchiq

  # Collector: только RabbitMQ + SStats.net. Без DATABASE_URL и без зависимости от postgres.
  collector:
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
    environment:
      COLLECTOR_ADDR: ":8081"
      COLLECTOR_LEAGUE: rpl
      RABBITMQ_URL: ${COLLECTOR_RABBITMQ_URL:-amqp://matchiq:matchiq@rabbitmq:5672/}
      SSTATS_API_KEY: ${SSTATS_API_KEY:-}
      SSTATS_BASE_URL: ${SSTATS_BASE_URL:-https://api.sstats.net}
      COLLECTOR_PREFETCH: ${COLLECTOR_PREFETCH:-2}
    ports:
      - "${COLLECTOR_PORT:-8081}:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - matchiq

  # Go-проверки только в контейнере: docker compose --profile tools run --rm collector-test
  collector-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/collector/Dockerfile
      target: test
    entrypoint: ["true"]
    networks:
      - matchiq

networks:
  matchiq:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
